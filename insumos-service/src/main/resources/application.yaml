server:
  port: ${PORT:8081}
  address: 0.0.0.0

spring:
  application:
    name: insumos-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:aws-0-us-west-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USER:postgres.ohmeczlnykzqaptimqof}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true